<nav mat-tab-nav-bar [tabPanel]="tabPanel" mat-stretch-tabs="false" mat-align-tabs="center">
  <a mat-tab-link *ngFor="let link of navLinks" [routerLink]="link.link" routerLinkActive #rla="routerLinkActive"
    [active]="rla.isActive">
    {{link.label}}
  </a>
</nav>

<mat-tab-nav-panel #tabPanel>
  <div [@triggerName]="prepareRoute(outlet)" class="container">
    <router-outlet #outlet="outlet"></router-outlet>
  </div>
</mat-tab-nav-panel>
