<ng-container *ngIf="customer != null; else empty">

    <div class="container-customer">
        <div class="section-bttns">
            <button mat-flat-button color="warn" (click)="openRemoveCustomer()">
                Excluir
            </button>
            <button mat-flat-button color="primary" (click)="openEditCustomer()">
                Editar
            </button>
        </div>

        <h1>Id: {{customer.id}}</h1>
        <h1>CPF: {{customer.cpf}}</h1>
        <h1>Name: {{customer.name}}</h1>
        <h1>É dependente de: {{customer.parent?.name || 'ninguém'}}</h1>
    </div>


    <div class="body">
        <nav mat-tab-nav-bar [tabPanel]="tabPanel" mat-stretch-tabs="false" mat-align-tabs="center">
            <a mat-tab-link *ngFor="let link of navLinks" [routerLink]="link.link" routerLinkActive #rla="routerLinkActive"
            [active]="rla.isActive">
            {{link.label}}
            </a>
        </nav>
        
        <mat-tab-nav-panel #tabPanel>
            <div class="container">
            <router-outlet #outlet="outlet"></router-outlet>
            </div>
        </mat-tab-nav-panel>
    </div>


    <ng-template #loading>
        <mat-spinner></mat-spinner>
    </ng-template>
   
</ng-container>

<ng-template #empty>
    <div class="auto-reply-message">
        <h1>Cliente não foi selecionado !</h1>
        <strong>Por favor, selecione um cliente</strong>
        <button mat-raised-button color="primary">Lista</button>
    </div>
</ng-template>
