<!--  Template for Form !  -->

<div class="container">
    <button 
        mat-raised-button 
        color="primary" 
        (click)="null"
        class="bttn-new">
            Novo
    </button>

    <div *ngIf="loading; else display" class="spinner-container">
        <mat-spinner></mat-spinner> <!-- Mat Spinner do Angular Material -->
    </div>
    
    <ng-template #display>
        <list-address [data]="addresses" [editable]="true"
        (updateById)="updateById($event)"
        (removeById)="removeById($event)"
        *ngIf="addresses.length > 0; else empty"/>

        <ng-template #empty>
            <div class="message-empty">
                <h1>Endereços estão vazios</h1>
                <span>Crie um endereço aqui mesmo !</span>
            </div>
        </ng-template>
    </ng-template>
</div>
