<mat-toolbar color="primary">
    <button class="box-button-menu" (click)="changeOpened(!opened)">
      <mat-icon class="title">menu</mat-icon>
      <h1 class="title">Amélia Revendedora</h1>
    </button>
    <span class="example-spacer"></span>
    <div *ngIf="authService.currentUserSig">
      <h2>{{ authService.currentUserSig()?.username }}</h2>
    </div>
</mat-toolbar>

<mat-drawer-container class="example-container" autosize>
  <mat-drawer #drawer class="example-sidenav" [(opened)]="opened" mode="side">
    <div class="drawer-area">
      <mat-list>

        <mat-list-item>
          <button [routerLink]="['/home']" routerLinkActive="LinkActive" class="sidenav-btt">
            <mat-icon>home</mat-icon>
            <a>Home</a>
          </button>
        </mat-list-item>

        <mat-list-item>
          <button [routerLink]="['/customer']" routerLinkActive="LinkActive" class="sidenav-btt">
            <mat-icon>person</mat-icon>
            <a>Cliente</a>
          </button>
        </mat-list-item>

        <mat-list-item>
          <button [routerLink]="['/product']" routerLinkActive="LinkActive" class="sidenav-btt">
            <mat-icon>sell</mat-icon>
            <a>Produto</a>
          </button>
        </mat-list-item>

        <mat-list-item>
          <button [routerLink]="['/order']" routerLinkActive="LinkActive" class="sidenav-btt">
            <mat-icon>border_all</mat-icon>
            <a>Pedido</a>
          </button>
        </mat-list-item>

        <mat-list-item>
          <button [routerLink]="['/inventory-control']" routerLinkActive="LinkActive" class="sidenav-btt">
            <!-- <mat-icon [matBadge]="inventoryStatus.qtyStatus" matBadgeColor="warn">home</mat-icon> -->
            <a>Estoque</a>
          </button>
        </mat-list-item>

        <mat-list-item>
          <button [routerLink]="['/dashboard']" routerLinkActive="LinkActive" class="sidenav-btt">
            <mat-icon>data_usage</mat-icon>
            <a>Vendas</a>
          </button>
        </mat-list-item>

        <mat-list-item>
          <button [routerLink]="['/admin']" routerLinkActive="LinkActive" class="sidenav-btt">
            <mat-icon>admin</mat-icon>
            <a>Administrador</a>
          </button>
        </mat-list-item>
        
      </mat-list>
    </div>
  </mat-drawer>
  <mat-drawer-content (click)="changeOpened(false)">
    <div class="router-outlet">
      <router-outlet></router-outlet>
    </div>
  </mat-drawer-content>
</mat-drawer-container>
